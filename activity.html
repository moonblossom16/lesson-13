<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Hobby Cards</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">

    <style>
        body {
            background-image: linear-gradient(to left, rgb(97, 188, 213), rgb(134, 134, 213));
            font-family: cursive;
            padding: 30px 15px;
        }
        h1 {
            text-align: center;
            color: rgb(122, 32, 163);
        }
        .hobby-card {
            text-align: center;
            border: 2px solid rgb(21, 23, 144);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            background-color: rgb(77, 82, 182);
            color: white;
        }
        .hobby-card h3 {
            color:rgb(24, 14, 98);
            font-size: 40px;
        }
    </style>

</head>
<body>
    <h1>My Hobby Cards</h1>

    <div class=" container">
        <div class="row">
            <div class="col-12 col-md-6 col-lg-4">
                <div class="hobby-card">
                    <h3>Reading</h3>
                    <p> I love reading new books and comics </p>
                </div>
            </div>
            <div class="col-12 col-md-6 col-lg-4">
                <div class="hobby-card">
                    <h3>Cycling</h3>
                    <p> I like to explore new places on my bike </p>
                </div>
            </div>
            <div class="col-12 col-md-6 col-lg-4">
                <div class="hobby-card">
                    <h3> Writing</h3>
                    <p> I love to write stories of far-away lands. </p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
